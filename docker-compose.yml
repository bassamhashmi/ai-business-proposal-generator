version: "3.8"
services:
  postgres:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proposal_generator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  ai-server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/proposal_generator
    depends_on:
      - postgres
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - AI_SERVER_URL=http://ai-server:8000
    depends_on:
      - ai-server

volumes:
  pgdata:
  ollama_models:
