<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @page {
        size: A4;
        margin: 2.5cm;
        @bottom-center {
          content: "Page " counter(page) " of " counter(pages);
          font-size: 9px;
          color: #888;
        }
      }
      body {
        font-family: "Helvetica", "Arial", sans-serif;
        color: #222;
        line-height: 1.5;
      }
      h1 {
        font-size: 24px;
        border-bottom: 2px solid #222;
        padding-bottom: 8px;
        margin-bottom: 4px;
      }
      .subtitle {
        color: #666;
        font-size: 13px;
        margin-bottom: 32px;
      }
      h2 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #444;
        margin-top: 28px;
        margin-bottom: 8px;
      }
      p {
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Business Proposal</h1>
    <div class="subtitle">Prepared for {{ business_name }}</div>

    <h2>Executive Summary</h2>
    <p>{{ executive_summary }}</p>

    <h2>Scope of Work</h2>
    <p>{{ scope_of_work }}</p>

    <h2>Timeline</h2>
    <p>{{ timeline }}</p>

    <h2>Pricing Overview</h2>
    <p>{{ pricing_overview }}</p>

    <h2>Next Steps</h2>
    <p>{{ next_steps }}</p>
  </body>
</html>
